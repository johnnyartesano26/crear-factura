name: Emitir Facturas

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sin crear facturas ni escribir Sheets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 16 * * *'  # 11 AM Colombia (UTC-5) todos los días

permissions:
  contents: read

jobs:
  emitir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install google-auth google-api-python-client aiohttp python-dotenv

      - name: Emitir facturas (versión canónica asíncrona)
        id: emitir
        env:
          ALEGRA_EMAIL: ${{ secrets.ALEGRA_EMAIL }}
          ALEGRA_TOKEN: ${{ secrets.ALEGRA_TOKEN }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: python facturacion_async.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Publicar diagnóstico agregado al dashboard
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          PAT: ${{ secrets.DASHBOARD_PAT }}
        run: |
          if [ ! -f resumen_facturacion.json ]; then
            echo "Sin resumen para publicar."
            exit 0
          fi
          if [ -z "$PAT" ]; then
            echo "Sin DASHBOARD_PAT configurado, se omite la publicación al dashboard."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/johnnyartesano26/dashboard-maestro.git" /tmp/dm
          cp resumen_facturacion.json /tmp/dm/data/resumen_facturacion.json
          # Acumular el registro en el historial de inventario (intervenible)
          python3 - <<'PY'
          import json, os
          record = json.load(open('resumen_facturacion.json'))
          hist_path = '/tmp/dm/data/historial_facturacion.json'
          hist = []
          if os.path.exists(hist_path):
              try:
                  hist = json.load(open(hist_path))
              except Exception:
                  hist = []
          if not isinstance(hist, list):
              hist = []
          hist.append(record)
          json.dump(hist, open(hist_path, 'w'), ensure_ascii=False, indent=2)
          print(f"Historial de facturación: {len(hist)} registros")
          PY
          cd /tmp/dm
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/resumen_facturacion.json data/historial_facturacion.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el diagnóstico."
          else
            git commit -m "Diagnóstico facturación $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Aviso por Telegram
        if: always()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUMEN: ${{ steps.emitir.outputs.resumen }}
        run: |
          if [ -n "$TG" ]; then
            DETALLE="$(cat detalle_telegram.txt 2>/dev/null || echo '')"
            MSG=$(printf '🧾 <b>Emisión de facturas — Madre Monte</b>\n📊 %s\n\n%s\n🔗 https://app.alegra.com' "${RESUMEN:-Proceso ejecutado (ver logs).}" "$DETALLE")
            curl -s -X POST "https://api.telegram.org/bot$TG/sendMessage" \
              --data-urlencode chat_id="$CID" \
              --data-urlencode parse_mode="HTML" \
              --data-urlencode text="$MSG" > /dev/null || true
          fi
